spring.config.import=optional:file:.env[.properties]
spring.application.name=challenge
spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=softlineChallenge;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
logging.level.org.springframework.security=DEBUG
jwt.secret=${JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:80}