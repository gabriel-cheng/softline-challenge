server {
    listen 80;
    server_name localhost;

    # Cabeçalhos padrão de proxy, reutilizados em todos os locations
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- Frontend (React/Vite servido pelo Nginx do container "frontend") ----
    location / {
        proxy_pass http://frontend:80;
    }

    # ---- Backend (API Spring Boot) ----
    # A barra final em ambos (location e proxy_pass) faz o Nginx remover
    # o prefixo /api/ antes de repassar pro backend.
    # Ex: requisição para /api/usuarios -> chega no backend como /usuarios
    location /api/ {
        proxy_pass http://backend:8080/;

        # Timeouts um pouco maiores, úteis para chamadas mais lentas
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ---- Suporte a WebSocket (caso use, ex: notificações em tempo real) ----
    location /ws/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
